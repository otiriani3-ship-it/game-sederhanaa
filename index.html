<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tap Koin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121826;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: min(100%, 420px);
      background: #1c2538;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }
h1 {
      margin: 0 0 8px;
    }

    p {
      margin: 8px 0 16px;
      color: #cfd8ff;
    }

    .info {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .box {
      flex: 1;
      background: #101726;
      border-radius: 14px;
      padding: 12px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 55vh;
      max-height: 420px;
      min-height: 320px;
      border: 2px dashed #4f6cff;
      border-radius: 18px;
      background: linear-gradient(180deg, #22304d, #111827);
      overflow: hidden;
    }
        #coin {
      position: absolute;
      width: 72px;
      height: 72px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff3a0, #ffcd38 45%, #d79100 100%);
      font-size: 34px;
      cursor: pointer;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      touch-action: manipulation;
    }

    #startBtn {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #4f6cff;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      min-height: 24px;
      margin-top: 10px;
      color: #9fd3ff;
    }
    
    
    #startBtn {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #4f6cff;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      min-height: 24px;
      margin-top: 10px;
      color: #9fd3ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Game Tap Koin</h1>
    <p>Tekan <b>Mulai</b>, lalu tap koin sebanyak mungkin sebelum waktu habis.</p>

    <div class="info">
      <div class="box">Skor<br><span id="score">0</span></div>
      <div class="box">Waktu<br><span id="time">15</span>s</div>
    </div>

    <div id="gameArea">
      <button id="coin" aria-label="Koin">🪙</button>
    </div>

    <button id="startBtn">Mulai Game</button>
    <div id="message">Siap bermain?</div>
  </div>

  <script>
    const coin = document.getElementById('coin');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const gameArea = document.getElementById('gameArea');
    const message = document.getElementById('message');

    let score = 0;
    let timeLeft = 15;
    let timer = null;
    let playing = false;
    function moveCoin() {
      const maxX = gameArea.clientWidth - coin.offsetWidth;
      const maxY = gameArea.clientHeight - coin.offsetHeight;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      coin.style.left = x + 'px';
      coin.style.top = y + 'px';
    }

    function startGame() {
      score = 0;
      timeLeft = 15;
      playing = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      message.textContent = 'Cepat tap koinnya!';
      startBtn.disabled = true;
      startBtn.style.opacity = '0.7';

      coin.style.display = 'block';
      moveCoin();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          playing = false;
          coin.style.display = 'none';
          startBtn.disabled = false;
          startBtn.style.opacity = '1';
          message.textContent = 'Waktu habis! Skor akhir: ' + score;
        }
      }, 1000);
    }

    coin.addEventListener('click', () => {
      if (!playing) return;
      score++;
      scoreEl.textContent = score;
      moveCoin();
    });
startBtn.addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      if (playing) moveCoin();
    });
  </script>
</body>
</html>
